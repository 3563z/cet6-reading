      "text": "In the past decade, a quiet revolution has been taking place in urban planning and public health policy. Governments across the globe have begun to recognize that physical infrastructure — parks, bike lanes, community sports facilities — is as crucial to public health as hospitals and clinics. This shift reflects a growing understanding that the most effective health interventions may not come in a pill bottle, but in the design of the environments where people live, work, and play.\n\nThe evidence supporting this approach is compelling. A comprehensive study published in The Lancet analyzed health data from 1.7 million people across 18 countries and found that residents of neighborhoods with accessible green spaces had a 16 percent lower risk of cardiovascular disease, even after controlling for income and education levels. Similarly, cities that have invested in protected bicycle infrastructure have seen cycling rates increase by an average of 75 percent, with corresponding reductions in obesity and diabetes rates.\n\nJapan offers a particularly instructive case. In 2015, the Japanese government launched the \"Sports and Health Nation\" initiative, which mandated that every municipality with more than 10,000 residents maintain publicly accessible sports facilities within walking distance. The program funded the construction of over 3,000 community fitness centers, each staffed with health advisors who provide personalized exercise guidance free of charge. Independent evaluations have documented measurable improvements in senior citizens' mobility, reduced healthcare expenditures, and — perhaps most significantly — a strengthening of community social bonds through shared physical activity.\n\nThe economic case for such investments is equally robust. The World Health Organization estimates that every dollar spent on promoting physical activity generates approximately four dollars in healthcare savings and productivity gains. In the United Kingdom, the National Health Service calculated that if every adult met the recommended 150 minutes of moderate exercise per week, the annual savings to the health system would exceed 9 billion pounds sterling. These figures have begun to capture the attention of finance ministries that traditionally viewed sports funding as discretionary rather than essential.\n\nHowever, significant barriers remain. In many low-income neighborhoods, the scarcity of safe, well-maintained exercise spaces perpetuates a cycle of poor health outcomes. Transportation infrastructure in countless cities remains overwhelmingly car-centric, discouraging walking and cycling. Moreover, cultural attitudes toward exercise vary widely; in some communities, particularly among elderly women and certain ethnic minority groups, social norms discourage participation in public physical activities.\n\nInnovative programs are emerging to address these challenges. In Brazil, the \"Health Academy\" program deploys mobile fitness units to underserved neighborhoods on a rotating schedule, ensuring that no community goes more than a week without access to supervised exercise classes. In India, a partnership between municipal governments and technology companies has created a mobile application that maps safe walking routes and organizes community walking groups, with over four million registered users. These initiatives share a common philosophy: that fitness should be treated not as an individual responsibility but as a collective public good.\n\nLooking forward, the integration of fitness infrastructure into urban design represents one of the most promising frontiers in preventive medicine. The challenge is not technological — we know what works — but political: building the coalitions necessary to reallocate resources toward the environments that shape our daily health. As one public health official observed, \"We have spent a century perfecting the medicine we give to sick people. The next century must be about building the world that keeps people well.\"",

    "prompt": "Directions: For this part, you are allowed 30 minutes to write an essay on the topic \"Online Learning vs Traditional Classroom Education.\" You should express your views on the advantages and disadvantages of both approaches and state your own preference. You should write at least 150 words but no more than 200 words.",
    "model": "The rapid advancement of digital technology has sparked an ongoing debate over whether online learning can replace traditional classroom education. While both approaches have their merits, I believe that a combination of the two offers the most effective educational experience.\n\nOn the one hand, online learning provides unmatched flexibility and accessibility. Students can access course materials at any time and from any location, making education available to those who might otherwise be excluded — such as working professionals or individuals in remote areas. Furthermore, digital platforms often offer a wider range of courses than any single institution can provide.\n\nOn the other hand, traditional classroom education fosters essential interpersonal skills that are difficult to replicate online. Face-to-face discussions, group projects, and spontaneous exchanges with instructors cultivate critical thinking and communication abilities. Moreover, the structured environment of a physical classroom helps students maintain discipline and motivation.\n\nIn my view, the future of education lies not in choosing one approach over the other but in thoughtfully integrating both. The ideal model would combine the flexibility of digital tools with the human connection of in-person learning, creating an educational experience that is both accessible and deeply engaging."
  }
};

// ========== UTILITY ==========
function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ========== RENDER ==========
function renderQuestions(containerId, questions, prefix) {
  var container = document.getElementById(containerId);
  if (!container) return;
  container.innerHTML = '';
  if (!questions || !questions.length) return;
  var letters = ['A','B','C','D'];
  questions.forEach(function(q, i) {
    var div = document.createElement('div');
    div.className = 'question-item';
    div.id = prefix + '-q-' + i;
    var html = '<p>' + (i+1) + '. ' + escapeHtml(q.q) + '</p>';
    letters.forEach(function(l) {
      html += '<label><input type="radio" name="' + prefix + '-' + i + '" value="' + l + '"> ' + l + '. ' + escapeHtml(q[l]) + '</label>';
    });
    div.innerHTML = html;
    container.appendChild(div);
  });
}

function renderVocab(containerId, vocab) {
  var table = document.getElementById(containerId);
  if (!table || !vocab || !vocab.length) return;
  table.innerHTML = '<tr><th>单词</th><th>音标</th><th>释义</th></tr>';
  vocab.forEach(function(v) {
    var row = table.insertRow();
    row.insertCell().textContent = v.word;
    row.insertCell().textContent = v.phonetic;
    row.insertCell().textContent = v.def;
  });
}

function renderText(containerId, text) {
  var el = document.getElementById(containerId);
  if (!el || !text) return;
  var parts = text.split(/\n\n+/);
  el.innerHTML = parts.map(function(p) {
    return '<p>' + escapeHtml(p).replace(/\n/g, '<br>') + '</p>';
  }).join('');
}

// ========== REVEAL ==========
function revealListening() {
  var keys = ['news', 'long_conversation', 'passage', 'lecture'];
  keys.forEach(function(key) {
    var data = DATA.listening[key];
    if (!data || !data.questions) return;
    data.questions.forEach(function(q, i) {
      var sel = document.querySelector('input[name="' + key + '-' + i + '"]:checked');
      var qDiv = document.getElementById(key + '-q-' + i);
      if (!qDiv) return;
      var sp = document.createElement('span');
      if (sel && sel.value === q.answer) {
        sp.className = 'correct';
        sp.textContent = ' ✓ 正确!';
      } else {
        sp.className = 'wrong';
        sp.textContent = sel ? ' ✗ 错误，正确答案是 ' + q.answer : ' 未作答，正确答案是 ' + q.answer;
      }
      qDiv.querySelector('p').appendChild(sp);
    });
    var scriptEl = document.getElementById(key + '-script');
    if (scriptEl) scriptEl.textContent = data.script;
    var revealEl = document.getElementById('listening-' + key + '-reveal');
    if (revealEl) revealEl.style.display = '';
    var audioR = document.getElementById(key + '-audio-r');
    if (audioR && data.audio) audioR.src = data.audio;
  });
  document.getElementById('listening-reveal').classList.add('show');
}

function revealReading() {
  var keys = ['tech', 'social', 'long'];
  var correct = 0, total = 0;
  keys.forEach(function(key) {
    var data = DATA.reading[key];
    if (!data || !data.questions) return;
    data.questions.forEach(function(q, i) {
      total++;
      var sel = document.querySelector('input[name="' + key + '-' + i + '"]:checked');
      var qDiv = document.getElementById(key + '-q-' + i);
      if (!qDiv) return;
      var sp = document.createElement('span');
      if (sel && sel.value === q.answer) {
        sp.className = 'correct';
        sp.textContent = ' ✓ 正确!';
        correct++;
      } else {
        sp.className = 'wrong';
        sp.textContent = sel ? ' ✗ 错误，正确答案是 ' + q.answer : ' 未作答，正确答案是 ' + q.answer;
      }
      qDiv.querySelector('p').appendChild(sp);
    });
  });
  var scoreEl = document.getElementById('reading-score');
  var detailEl = document.getElementById('reading-detail');
  if (scoreEl) scoreEl.textContent = correct + ' / ' + total;
  if (detailEl) detailEl.textContent = total > 0 && correct >= Math.ceil(total * 0.6) ? '合格 ✓' : '需要加油 ✗';
  document.getElementById('reading-reveal').classList.add('show');
}

function revealTranslation() {
  document.getElementById('translation-ref').textContent = DATA.translation.reference;
  document.getElementById('translation-reveal').classList.add('show');
}

function revealWriting() {
  document.getElementById('writing-model').textContent = DATA.writing.model;
  document.getElementById('writing-reveal').classList.add('show');
}

// ========== INIT ==========
(function init() {
  // --- Listening ---
  var lKeys = ['news', 'long_conversation', 'passage', 'lecture'];
  var anyListening = false;
  lKeys.forEach(function(key) {
    var data = DATA.listening[key];
    var subEl = document.getElementById('listening-' + key);
    if (!subEl) return;
    if (data && data.questions && data.questions.length > 0) {
      subEl.style.display = '';
      anyListening = true;
      renderQuestions(key + '-questions', data.questions, key);
      var audioEl = document.getElementById(key + '-audio');
      if (audioEl && data.audio) audioEl.src = data.audio;
    } else {
      subEl.style.display = 'none';
    }
  });
  // 如果没有任何听力数据，隐藏整个听力区
  if (!anyListening) {
    document.getElementById('listening').style.display = 'none';
  }

  // --- Reading ---
  var rKeys = ['tech', 'social', 'long'];
  var anyReading = false;
  rKeys.forEach(function(key) {
    var data = DATA.reading[key];
    var subEl = document.getElementById('reading-' + key);
    if (!subEl) return;
    if (data) {
      subEl.style.display = '';
      anyReading = true;
      if (data.text) renderText(key + '-text', data.text);
      if (data.vocab && data.vocab.length > 0) renderVocab(key + '-vocab', data.vocab);
      if (data.questions) renderQuestions(key + '-questions', data.questions, key);
    } else {
      subEl.style.display = 'none';
    }
  });
  if (!anyReading) {
    document.getElementById('reading').style.display = 'none';
  }

  // --- Translation & Writing ---
  if (DATA.translation) {
    document.getElementById('translation-prompt').textContent = DATA.translation.cn;
  }
  if (DATA.writing) {
    document.getElementById('writing-prompt').textContent = DATA.writing.prompt;
  }
})();
</script>
