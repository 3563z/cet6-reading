<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>六级练习数据看板</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f5f7fa;color:#1a1a2e;padding:16px}
.container{max-width:800px;margin:0 auto}
.header{text-align:center;padding:32px 0 16px}
.header h1{font-size:24px;font-weight:700}
.header .sub{font-size:14px;color:#888;margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:20px 0}
.stat-card{background:#fff;border-radius:12px;padding:16px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,0.06)}
.stat-card .num{font-size:28px;font-weight:700;color:#1a73e8}
.stat-card .label{font-size:13px;color:#888;margin-top:4px}
.chart-section{background:#fff;border-radius:16px;padding:20px;margin:16px 0;box-shadow:0 2px 8px rgba(0,0,0,0.06)}
.chart-section h2{font-size:16px;font-weight:600;margin-bottom:16px;color:#333}
.chart-wrap{height:280px}
.day-list{background:#fff;border-radius:16px;padding:20px;margin:16px 0;box-shadow:0 2px 8px rgba(0,0,0,0.06)}
.day-list h2{font-size:16px;font-weight:600;margin-bottom:12px;color:#333}
.day-item{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee;font-size:14px}
.day-item:last-child{border-bottom:none}
.day-item .date{color:#1a73e8;font-weight:600}
.day-item .qcount{color:#666}
.tag-badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:6px;margin:2px}
.tag-tech{background:#e3f2fd;color:#1565c0}
.tag-human{background:#fce4ec;color:#c62828}
.btn{padding:10px 16px;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}
.btn:active{opacity:.8}
.footer{text-align:center;padding:32px 0 16px;font-size:12px;color:#aaa}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>📊 六级练习数据看板</h1>
    <div class="sub" id="summary"></div>
  </div>

  <div class="stats" id="stats"></div>

  <div class="chart-section">
    <h2>📅 每日题量</h2>
    <div class="chart-wrap"><canvas id="dailyChart"></canvas></div>
  </div>

  <div class="chart-section">
    <h2>🔤 选项分布（所有题目汇总）</h2>
    <div class="chart-wrap"><canvas id="answerChart"></canvas></div>
  </div>

  <div class="chart-section">
    <h2>🏷️ 话题标签统计</h2>
    <div class="chart-wrap"><canvas id="tagChart"></canvas></div>
  </div>

  <div class="chart-section" id="writingSection" style="display:none">
    <h2>✍️ 翻译与写作</h2>
    <div id="writingContent"></div>
  </div>

  <div class="chart-section" id="myRecordsSection" style="display:none">
    <h2>🙋 我的答题记录</h2>
    <div style="display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap">
      <span style="font-size:12px;color:#888;align-self:center">数据存在当前浏览器 localStorage</span>
      <button class="btn" onclick="manualAdd()" style="background:#e8eaed;color:#444">➕ 手动添加记录</button>
    </div>
    <div class="stats" id="myStats"></div>
    <div class="chart-wrap" style="height:220px"><canvas id="myScoreChart"></canvas></div>
    <div id="myRecordsList" style="margin-top:12px"></div>
  </div>

  <div id="manualAddModal" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.3);z-index:1000;align-items:center;justify-content:center">
    <div style="background:#fff;border-radius:16px;padding:24px;width:90%;max-width:320px;margin:auto">
      <h3 style="font-size:16px;margin-bottom:12px">手动添加答题记录</h3>
      <label style="display:block;font-size:13px;color:#666;margin-bottom:4px">日期</label>
      <input id="manualDate" type="date" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;margin-bottom:12px;font-size:14px">
      <label style="display:block;font-size:13px;color:#666;margin-bottom:4px">得分（格式: 15/20）</label>
      <input id="manualScore" type="text" placeholder="例如: 15/20" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;margin-bottom:16px;font-size:14px">
      <div style="display:flex;gap:10px">
        <button class="btn" onclick="manualSave()" style="background:#1a73e8;color:#fff;flex:1">保存</button>
        <button class="btn" onclick="closeManual()" style="background:#e8eaed;color:#444;flex:1">取消</button>
      </div>
    </div>
  </div>

  <div class="day-list" id="dayList">
    <h2>📋 每日明细</h2>
  </div>

  <div class="footer">
    每日六级 · 数据看板 · 数据从 daily/*.html 自动生成
  </div>
</div>

<script>
// ===== 主渲染 =====
fetch('./data.json')
  .then(function(r) { return r.json(); })
  .then(function(data) {
    renderStats(data);
    renderDayList(data);
    renderDailyChart(data);
    renderAnswerChart(data);
    renderTagChart(data);
    renderWriting(data);
    renderMyRecords();
  });

function renderStats(data) {
  var total = data.reduce(function(s, d) { return s + d.totalQuestions; }, 0);
  document.getElementById('summary').textContent = data.length + ' 天 · ' + total + ' 道题';
  document.getElementById('stats').innerHTML =
    '<div class="stat-card"><div class="num">' + data.length + '</div><div class="label">📆 天数</div></div>' +
    '<div class="stat-card"><div class="num">' + total + '</div><div class="label">📝 总题量</div></div>' +
    '<div class="stat-card"><div class="num">' + Math.round(total / data.length) + '</div><div class="label">📊 日均题量</div></div>';
}

function renderDayList(data) {
  var el = document.getElementById('dayList');
  data.forEach(function(d) {
    var tags = d.tags.map(function(t) { return '<span class="tag-badge ' + t.class + '">' + t.label + '</span>'; }).join('');
    el.innerHTML += '<div class="day-item"><span class="date">' + fmt(d.date) + '</span><span>' + tags + '</span><span class="qcount">' + d.totalQuestions + ' 题</span></div>';
  });
}

function renderDailyChart(data) {
  new Chart(document.getElementById('dailyChart'), {
    type: 'bar',
    data: {
      labels: data.map(function(d) { return fmt(d.date).slice(5); }),
      datasets: [
        { label: '听力', data: data.map(function(d) { return d.listeningCount; }), backgroundColor: '#e3f2fd', borderColor: '#1a73e8', borderWidth: 1 },
        { label: '阅读', data: data.map(function(d) { return d.readingCount; }), backgroundColor: '#fce4ec', borderColor: '#c62828', borderWidth: 1 }
      ]
    },
    options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, ticks: { stepSize: 5 } } } }
  });
}

function renderAnswerChart(data) {
  var counts = { A: 0, B: 0, C: 0, D: 0 };
  data.forEach(function(d) { d.questions.forEach(function(q) { if (counts[q.answer]) counts[q.answer]++; else counts[q.answer] = 1; }); });
  new Chart(document.getElementById('answerChart'), {
    type: 'doughnut',
    data: {
      labels: ['A (' + counts.A + ')', 'B (' + counts.B + ')', 'C (' + counts.C + ')', 'D (' + counts.D + ')'],
      datasets: [{ data: [counts.A, counts.B, counts.C, counts.D], backgroundColor: ['#e3f2fd','#e8f5e9','#fff3e0','#fce4ec'], borderColor: ['#1a73e8','#34a853','#f9ab00','#ea4335'], borderWidth: 2 }]
    },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
  });
}

function renderTagChart(data) {
  var t = {};
  data.forEach(function(d) { d.tags.forEach(function(tag) { var label = tag.label.replace(/[🔬🌍🔤✍️📝]/g,'').trim(); t[label] = (t[label] || 0) + 1; }); });
  var sorted = Object.entries(t).sort(function(a,b) { return b[1] - a[1]; });
  new Chart(document.getElementById('tagChart'), {
    type: 'bar',
    data: { labels: sorted.map(function(s) { return s[0]; }), datasets: [{ label: '次数', data: sorted.map(function(s) { return s[1]; }), backgroundColor: '#e8f0fe', borderColor: '#1a73e8', borderWidth: 1 }] },
    options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, scales: { x: { beginAtZero: true, ticks: { stepSize: 1 } } }, plugins: { legend: { display: false } } }
  });
}

function renderWriting(data) {
  var has = data.filter(function(d) { return d.writing || d.translation; });
  if (!has.length) return;
  document.getElementById('writingSection').style.display = 'block';
  var el = document.getElementById('writingContent');
  has.forEach(function(d) {
    var h = '<div style="margin-bottom:16px"><strong style="color:#1a73e8">' + fmt(d.date) + '</strong>';
    if (d.translation) {
      h += '<details style="margin-top:8px"><summary>📝 翻译</summary>' +
        '<div style="padding:10px;background:#f0f4ff;border-radius:8px;margin:8px 0;font-size:14px"><div style="color:#666;font-size:12px">中文原文</div><div>' + esc(d.translation.chinese) + '</div></div>' +
        '<div style="padding:10px;background:#e8f5e9;border-radius:8px;margin:8px 0;font-size:14px"><div style="color:#666;font-size:12px">参考译文</div><div>' + esc(d.translation.english) + '</div></div></details>';
    }
    if (d.writing) {
      h += '<details style="margin-top:8px"><summary>✏️ 写作</summary>' +
        '<div style="padding:10px;background:#f0f4ff;border-radius:8px;margin:8px 0;font-size:14px"><div style="color:#666;font-size:12px">题目</div><div>' + esc(d.writing.prompt) + '</div></div>' +
        '<div style="padding:10px;background:#e8f5e9;border-radius:8px;margin:8px 0;font-size:14px"><div style="color:#666;font-size:12px">参考范文</div><div>' + esc(d.writing.essay) + '</div></div></details>';
    }
    h += '</div>';
    el.innerHTML += h;
  });
}

// ===== 我的答题记录 =====
function renderMyRecords() {
  // Read local
  var local = [];
  for (var i = 0; i < localStorage.length; i++) {
    var key = localStorage.key(i);
    if (key && key.startsWith('cet6_records_')) {
      try { local.push(JSON.parse(localStorage.getItem(key))); } catch(e) {}
    }
  }

  showScores(local);
}

function showScores(records) {
  if (!records.length) return;
  document.getElementById('myRecordsSection').style.display = 'block';

  // Parse
  var s = records.map(function(r) {
    var m = r.score.match(/^(\d+)\/(\d+)/);
    return { date: r.date, correct: m ? parseInt(m[1]) : 0, total: m ? parseInt(m[2]) : 0, pct: m ? Math.round(parseInt(m[1])/parseInt(m[2])*100) : 0, raw: r };
  });
  var avg = Math.round(s.reduce(function(a, d) { return a + d.pct; }, 0) / s.length);

  document.getElementById('myStats').innerHTML =
    '<div class="stat-card"><div class="num">' + records.length + '</div><div class="label">🎯 答题次数</div></div>' +
    '<div class="stat-card"><div class="num">' + avg + '%</div><div class="label">📈 平均正确率</div></div>' +
    '<div class="stat-card"><div class="num">' + s.reduce(function(a, d) { return a + d.correct; }, 0) + '</div><div class="label">✅ 累计正确</div></div>' +
    '<div class="stat-card"><div class="num">' + s.reduce(function(a, d) { return a + d.total; }, 0) + '</div><div class="label">📝 累计答题</div></div>';

  // Chart (if 2+ records)
  var chartEl = document.getElementById('myScoreChart');
  if (chartEl && s.length >= 2) {
    new Chart(chartEl, {
      type: 'line',
      data: {
        labels: s.map(function(d) { return fmt(d.date).slice(5); }),
        datasets: [{ label: '正确率', data: s.map(function(d) { return d.pct; }), borderColor: '#34a853', backgroundColor: 'rgba(52,168,83,0.1)', fill: true, tension: 0.3, pointRadius: 5, pointBackgroundColor: '#34a853' }]
      },
      options: { responsive: true, maintainAspectRatio: false, scales: { y: { min: 0, max: 100, ticks: { callback: function(v) { return v + '%'; } } } }, plugins: { legend: { display: false } } }
    });
  }

  // List
  var listEl = document.getElementById('myRecordsList');
  listEl.innerHTML = '<div style="font-size:13px;color:#888;margin-bottom:8px">按日期倒序 · 本地 + 远程数据</div>';
  records.slice().reverse().forEach(function(r) {
    var match = r.score.match(/^(\d+)\/(\d+)/);
    var pct = match ? Math.round(parseInt(match[1])/parseInt(match[2])*100) : 0;
    listEl.innerHTML += '<div class="day-item"><span class="date">' + fmt(r.date) + '</span><span style="color:' + (pct>=60?'#34a853':'#ea4335') + ';font-weight:600">' + r.score + '</span></div>';
  });
}

// ===== 手动录入 =====
function manualAdd() {
  document.getElementById('manualAddModal').style.display = 'flex';
  var today = new Date();
  document.getElementById('manualDate').value = today.getFullYear() + '-' + String(today.getMonth()+1).padStart(2,'0') + '-' + String(today.getDate()).padStart(2,'0');
  document.getElementById('manualScore').value = '';
}
function closeManual() { document.getElementById('manualAddModal').style.display = 'none'; }
function manualSave() {
  var dateInput = document.getElementById('manualDate').value; // YYYY-MM-DD
  var score = document.getElementById('manualScore').value.trim();
  if (!score || !score.match(/^\d+\/\d+/)) { alert('请输入有效得分，格式如: 15/20'); return; }
  var dateStr = dateInput.replace(/-/g, '');
  var key = 'cet6_records_' + dateStr;
  localStorage.setItem(key, JSON.stringify({ score: score, date: dateStr, timestamp: Date.now() }));
  closeManual();
  location.reload();
}

function esc(s) { if (!s) return ''; return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmt(d) { return d.slice(0,4) + '-' + d.slice(4,6) + '-' + d.slice(6,8); }
</script>
</body>
</html>
